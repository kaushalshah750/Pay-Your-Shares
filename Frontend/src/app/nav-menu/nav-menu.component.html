<header>
  <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light bg-white border-bottom box-shadow">
    <div class="container">
      <div class="d-flex align-items-center">
        <img src="../../assets/logo/logo-nobg.png" class="pointer mr-4" [routerLink]="['/group']" width="70px" alt="">
        <div>
          <h2 class="mb-0 py-0 pointer navbar-brand" [routerLink]="['/group']">Pay Your Share</h2>
          <h5 class="mb-0 py-0 pointer navbar-brand" [routerLink]="['/group']">Payment Splitting made Simple</h5>
        </div>
      </div>
      <div class="d-flex align-items-center">
        <img [src]="userinfo.picture" [matMenuTriggerFor]="menu" class="rounded-circle" width="40px" alt="">
        <mat-menu #menu="matMenu" xPosition="before">
          <button mat-menu-item disabled>
            <mat-icon>insert_emoticon</mat-icon>
            <b class="mr-3">Hi {{user.name}}</b>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item [routerLink]="['my-profile']">
            <mat-icon>person</mat-icon>
            <h3 class="mb-0">My Profile</h3>
          </button>
          <button mat-menu-item [routerLink]="['group']">
            <mat-icon>group</mat-icon>
            <h3 class="mb-0">Groups</h3>
          </button>
          <button mat-menu-item (click)="giveFeedback()">
            <mat-icon>feedback</mat-icon>
            <h3 class="mb-0">Feedback</h3>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="signOut()">
            <mat-icon>exit_to_app</mat-icon>
            <h3 class="mb-0">Log out</h3>
          </button>
        </mat-menu>  
      </div>
    </div>
  </nav>
</header>
