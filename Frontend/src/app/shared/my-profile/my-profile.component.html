<!-- Custom loading bar -->
<div *ngIf="isLoading" class="h-1 bg-blue-200 w-full overflow-hidden">
    <div class="h-full bg-blue-600 animate-pulse"></div>
</div>

<div class="py-8 bg-gray-50 min-h-full">
    <div class="container mx-auto px-4 max-w-3xl">
        <div class="bg-white rounded-lg shadow-sm p-6">
            <h2 class="text-xl font-semibold mb-6 text-gray-800">My Profile</h2>

            <form [formGroup]="createform">
                <!-- Profile Picture -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Profile Picture</label>
                    <div class="flex items-center">
                        <img [src]="users.Picture" alt="Profile picture" class="w-20 h-20 rounded-full object-cover border border-gray-200">
                        <!-- You could add an upload button here if needed -->
                    </div>
                </div>

                <!-- Form Fields -->
                <div class="space-y-5">
                    <!-- Full Name -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="name" formControlName="name" (ngModelChange)="checkChangedValue()" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" [ngClass]="{'border-red-500': createform.controls['name'].invalid && createform.controls['name'].touched}">
                        <p *ngIf="createform.controls['name'].invalid && createform.controls['name'].touched" class="mt-1 text-sm text-red-600">
                            {{createform.controls['name'].hasError('required') ? "You must enter a value" : "It should be Minimum 5 Character Long"}}
                        </p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="email" formControlName="email" class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100 shadow-sm text-gray-500" readonly>
                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <div class="flex">
                            <span class="inline-flex items-center px-3 py-2 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">
                  +91
                </span>
                            <input type="number" id="phone" formControlName="phone" (ngModelChange)="checkChangedValue()" class="flex-1 min-w-0 block w-full px-3 py-2 border border-gray-300 rounded-r-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" [ngClass]="{'border-red-500': createform.controls['phone'].invalid && createform.controls['phone'].touched}">
                        </div>
                        <p *ngIf="createform.controls['phone'].invalid && createform.controls['phone'].touched" class="mt-1 text-sm text-red-600">
                            {{createform.controls['phone'].hasError('required') ? "You must enter your number" : "Your number should be 10 Digits"}}
                        </p>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mt-6">
                    <button type="button" [disabled]="!valueChanged || isLoading" (click)="updateUser()" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Update
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
