<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="fixed top-0 left-0 w-full">
        <div class="h-1 bg-blue-600 animate-pulse"></div>
    </div>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300">
        <!-- Card Header -->
        <div class="bg-gradient-to-r from-blue-600 to-blue-700 p-8 flex flex-col items-center">
            <div class="mb-6">
                <img src="../../../assets/logo/new_logo_white.png" class="w-40 h-40 object-contain" alt="Logo">
            </div>

            <!-- Conditional Fields -->
            <div class="w-full space-y-4" *ngIf="groupId && inviteId" [formGroup]="createform">
                <div>
                    <label for="email" class="block text-white text-sm font-medium mb-1">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                            </svg>
                        </div>
                        <input type="text" id="email" name="email" formControlName="Email" class="w-full pl-10 pr-4 py-2.5 bg-white/20 text-white placeholder-white/60 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent disabled:opacity-70"
                            placeholder="Your email address">
                    </div>
                </div>

                <div>
                    <label for="invite-code" class="block text-white text-sm font-medium mb-1">Invite Code</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                        </div>
                        <input type="text" id="invite-code" name="invite-code" formControlName="Code" class="w-full pl-10 pr-4 py-2.5 bg-white/20 text-white placeholder-white/60 border border-white/30 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent disabled:opacity-70"
                            placeholder="Your invite code">
                    </div>
                </div>
            </div>

            <!-- Login Button -->
            <button (click)="callGoogleUrl()" class="w-full mt-6 bg-white text-gray-700 py-3 px-6 rounded-lg font-medium shadow-lg flex items-center justify-center hover:bg-gray-50 active:bg-gray-100 transition duration-200 relative group" [disabled]="groupId && inviteId ? createform.invalid : false">
                <span class="absolute left-4 transition-transform group-hover:scale-110">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" />
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
                    </svg>
                </span>
                <span class="ml-6">Continue with Google</span>
            </button>
        </div>

        <!-- Card Footer -->
        <div class="px-8 py-6">
            <p class="text-center text-gray-600 text-sm">
                Securely split expenses with friends and family
            </p>
            <!-- <div class="mt-4 flex justify-center space-x-4">
                <a href="#" class="text-xs text-blue-600 hover:text-blue-800 transition">Privacy Policy</a>
                <span class="text-gray-300">|</span>
                <a href="#" class="text-xs text-blue-600 hover:text-blue-800 transition">Terms of Service</a>
            </div> -->
        </div>
    </div>
</div>
