<div class="bg-white rounded-lg shadow-xl overflow-hidden max-w-md w-full mx-auto">
    <!-- Header -->
    <div class="bg-indigo-600 px-6 py-4 flex items-center justify-between">
        <h2 class="text-xl font-semibold text-white">Share Your Feedback</h2>
        <button type="button" [mat-dialog-close]="false" class="text-white hover:text-indigo-100 focus:outline-none transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>

    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="h-1 w-full bg-indigo-100">
        <div class="h-1 bg-indigo-600 animate-pulse"></div>
    </div>

                    How can we improve our service?
                </label>
                <div class="relative">
                    <textarea id="feedback" rows="5" formControlName="Feedback" class="w-full px-4 py-3 text-gray-700 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none" placeholder="We value your thoughts and suggestions..."></textarea>
                </div>
                <p class="mt-1 text-xs text-gray-500">
                    Your feedback helps us improve Pay Your Share for everyone.
                </p>
            </div>

    <!-- Action buttons -->
    <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3">
        <button type="button" [mat-dialog-close]="false" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
            Cancel
        </button>
        <button type="button" [disabled]="isLoading" (click)="createFeedback()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            <span *ngIf="!isLoading">Submit Feedback</span>
            <span *ngIf="isLoading" class="flex items-center">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Processing...
            </span>
        </button>
    </div>
</div>
