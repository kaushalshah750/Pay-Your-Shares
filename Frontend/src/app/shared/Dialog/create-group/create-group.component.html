<div class="bg-white rounded-lg shadow-xl overflow-hidden max-w-md w-full">
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-medium text-gray-900">Create new Group</h2>
    </div>

    <div *ngIf="isLoading" class="h-1 bg-blue-200 w-full overflow-hidden">
        <div class="h-full bg-blue-600 animate-pulse"></div>
    </div>

    <div class="px-6 py-4">
        <form [formGroup]="createGroupform" class="space-y-6">
            <!-- Group Name -->
            <div class="mb-4">
                <label for="group-name" class="block text-sm font-medium text-gray-700 mb-1">Group Name</label>
                <input type="text" id="group-name" formControlName="Name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="description" formControlName="Description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
            </div>
        </form>
    </div>

    <div class="px-6 py-3 bg-gray-50 flex justify-end space-x-3 border-t border-gray-200">
        <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-colors" [mat-dialog-close]="false">Cancel</button>
        <button type="submit" class="px-5 py-2 flex items-center bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed" [disabled]="isLoading" (click)="createGroup()">
            <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Create
        </button>
    </div>
</div>
