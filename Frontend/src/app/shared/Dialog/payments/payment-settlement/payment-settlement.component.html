<div class="bg-white rounded-lg shadow-xl overflow-hidden max-w-md w-full">
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-medium text-gray-900">Settle Your Payments</h2>
    </div>

    <!-- Loading Bar -->
    <div class="w-full h-1 bg-gray-200 relative overflow-hidden mb-4" *ngIf="isLoading">
        <div class="absolute top-0 h-full bg-blue-600 animate-indeterminate-progress"></div>
    </div>

    <div class="px-6 py-4">
        <form [formGroup]="createform">
            <div class="mb-3">
                <h3 class="text-md font-bold font-poppins">Settle Payment: {{ user.user.Name }}</h3>
                <h3 class="text-md font-bold font-poppins">
                    {{ user.balance > 0 ? "You will receive : ₹" + user.balance.toFixed(2) : "You have to pay : ₹" + (user.balance * -1).toFixed(2) }}
                </h3>
            </div>

            <div class="mb-4">
                <label for="settle-amount" class="block text-sm font-medium text-gray-700 mb-1">Settle Amount</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">₹</span>
                    <input type="number" id="settle-amount" formControlName="amount" placeholder="0" [min]="0" [max]="(user.balance < 0 ? user.balance * -1 : user.balance)" class="w-full pl-8 pr-8 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-right">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500">.00</span>
                </div>
            </div>
        </form>
    </div>

    <div class="px-6 py-3 bg-gray-50 flex justify-end space-x-3 border-t border-gray-200">
        <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-colors" [mat-dialog-close]="false">Cancel</button>
        <button [disabled]="isLoading" type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed" (click)="createTransactionSettlement()">Settle</button>
    </div>
</div>
