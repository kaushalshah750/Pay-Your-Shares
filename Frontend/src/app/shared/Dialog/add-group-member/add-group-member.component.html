<!-- Loading bar -->
<div *ngIf="isLoading" class="h-1 bg-blue-200 w-full overflow-hidden mb-6">
    <div class="h-full bg-blue-600 animate-pulse"></div>
</div>

<div class="p-6 w-full max-w-md mx-auto">
    <h2 class="text-xl font-semibold mb-4">
        {{ globalVarService.user.User_id === group.Admin.User_id ? "Invite Members in Group" : "Members in Group" }}
    </h2>

    <!-- Member List -->
    <div class="space-y-3">
        <div *ngFor="let user of group.Members" class="bg-white rounded-xl shadow-md p-4 flex items-center justify-between">
            <div class="flex items-center">
                <img [src]="user.Picture" class="w-10 h-10 rounded-full object-cover" alt="User picture">
                <h3 class="ml-3 text-base font-medium text-gray-800">{{ user.Name }}</h3>
            </div>

            <!-- Delete Icon -->
            <div class="flex items-center" *ngIf="globalVarService.user.User_id !== user.User_id && globalVarService.user.User_id === group.Admin.User_id">
                <button class="text-red-600 hover:text-red-700 transition" (click)="removeGroupMemberbyGroupId(user.User_id)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Email Form -->
    <div class="mt-6" *ngIf="globalVarService.user.User_id === group.Admin.User_id">
        <form [formGroup]="addGroupMemberform" (ngSubmit)="inviteMember()">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input id="email" type="email" formControlName="Email" placeholder="Enter user email" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none transition" [ngClass]="{'border-red-500': addGroupMemberform.get('Email')?.invalid && (addGroupMemberform.get('Email')?.dirty || addGroupMemberform.get('Email')?.touched)}"
            />

            <!-- Error Message -->
            <div *ngIf="addGroupMemberform.get('Email')?.invalid && (addGroupMemberform.get('Email')?.dirty || addGroupMemberform.get('Email')?.touched)" class="mt-1 text-sm text-red-600">
                <div *ngIf="addGroupMemberform.get('Email')?.errors?.['required']">Email is required.</div>
                <div *ngIf="addGroupMemberform.get('Email')?.errors?.['email']">Please enter a valid email address.</div>
            </div>
        </form>
    </div>

    <!-- Footer Buttons -->
    <div class="flex justify-end space-x-3 mt-6">
        <button type="button" class="px-5 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200 transition" [mat-dialog-close]="false">Cancel</button>
        <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition disabled:opacity-50" [disabled]="isLoading || addGroupMemberform.invalid" (click)="inviteMember()">Invite</button>
    </div>
</div>
